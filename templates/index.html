<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>API Documentation Generator</title>


    <style>

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
        }


        body {
            background: #f4f6f9;
            color: #1f2937;
        }


        header {
            background: #111827;
            color: white;
            padding: 25px;
            text-align: center;
        }


        header h1 {
            font-size: 30px;
            margin-bottom: 8px;
        }


        header p {
            color: #cbd5e1;
        }


        .container {
            max-width: 1100px;
            margin: 35px auto;
            padding: 20px;
        }


        .card {
            background: white;
            padding: 25px;
            border-radius: 15px;
            box-shadow: 0 5px 20px rgba(0,0,0,0.08);
        }


        h2 {
            margin-bottom: 15px;
        }


        textarea {
            width: 100%;
            height: 300px;
            padding: 18px;

            resize: vertical;

            background: #111827;
            color: #e5e7eb;

            border: none;
            border-radius: 10px;

            font-family: Consolas, monospace;
            font-size: 14px;

            outline: none;
        }


        textarea:focus {
            border: 2px solid #4f46e5;
        }


        button {
            width: 100%;
            margin-top: 15px;

            padding: 14px;

            background: #4f46e5;
            color: white;

            border: none;
            border-radius: 9px;

            font-size: 16px;
            font-weight: bold;

            cursor: pointer;
        }


        button:hover {
            background: #4338ca;
        }


        #result {
            display: none;
            margin-top: 30px;
        }


        .api-card {
            border: 1px solid #e5e7eb;
            border-radius: 10px;

            padding: 18px;
            margin-top: 15px;

            background: #f9fafb;
        }


        .method {
            display: inline-block;

            padding: 5px 10px;

            border-radius: 5px;

            background: #16a34a;
            color: white;

            font-size: 12px;
            font-weight: bold;
        }


        .route {
            font-family: Consolas, monospace;
            font-size: 18px;
            font-weight: bold;

            margin-left: 10px;
        }


        .description {
            margin-top: 12px;
            color: #4b5563;
        }


        .function {
            margin-top: 8px;

            font-family: Consolas, monospace;

            color: #4f46e5;
        }


        .empty {
            text-align: center;
            padding: 25px;
            color: #6b7280;
        }


        footer {
            text-align: center;
            margin-top: 25px;
            color: #6b7280;
            font-size: 14px;
        }

    </style>

</head>


<body>


<header>

    <h1>API Documentation Generator</h1>

    <p>
        Automatically generate API documentation from source code
    </p>

</header>



<div class="container">

    <div class="card">

        <h2>Paste Your API Code</h2>

        <textarea
            id="code"
            placeholder="Paste your Flask API code here..."></textarea>


        <button onclick="generateDocumentation()">

            Generate Documentation

        </button>


        <div id="result">

            <h2>Generated Documentation</h2>

            <div id="documentation"></div>

        </div>

    </div>


    <footer>

        API Documentation Generator • Diploma Project

    </footer>

</div>



<script>

async function generateDocumentation() {

    const code =
        document.getElementById("code").value;

    const result =
        document.getElementById("result");

    const documentation =
        document.getElementById("documentation");


    if (!code.trim()) {

        alert("Please paste your API code first.");

        return;
    }


    try {

        const response = await fetch("/generate", {

            method: "POST",

            headers: {
                "Content-Type": "application/json"
            },

            body: JSON.stringify({
                code: code
            })

        });


        const data = await response.json();


        documentation.innerHTML = "";


        if (!data.success) {

            documentation.innerHTML =
                `<div class="empty">
                    ${data.message}
                </div>`;

        }

        else if (data.documentation.length === 0) {

            documentation.innerHTML =
                `<div class="empty">
                    No API endpoints were detected.
                </div>`;

        }

        else {

            data.documentation.forEach(api => {

                const card =
                    document.createElement("div");

                card.className = "api-card";


                card.innerHTML = `

                    <span class="method">
                        ${api.method}
                    </span>

                    <span class="route">
                        ${api.route}
                    </span>

                    <div class="description">

                        <strong>Description:</strong>
                        ${api.description}

                    </div>

                    <div class="function">

                        Function:
                        ${api.function}

                    </div>

                `;


                documentation.appendChild(card);

            });

        }


        result.style.display = "block";

    }

    catch (error) {

        alert(
            "Unable to generate documentation."
        );

        console.error(error);

    }

}

</script>


</body>

</html>
